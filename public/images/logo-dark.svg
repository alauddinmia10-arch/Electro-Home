<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <style>
      .text-electro { font-family: 'Montserrat', 'Inter', system-ui, sans-serif; font-size: 56px; font-weight: 800; fill: #FFFFFF; }
      .text-home { fill: #16A34A; }
      .text-tagline { font-family: 'Montserrat', 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 600; fill: #64748B; letter-spacing: 0.35em; }
      .icon-green { fill: none; stroke: #16A34A; stroke-width: 16; stroke-linecap: round; stroke-linejoin: round; }
      .icon-white { fill: none; stroke: #FFFFFF; stroke-width: 16; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  
  <g transform="translate(0, 0)">
    <path class="icon-green" d="M 29 60 L 29 45 L 49 25 L 90 25" />
    <path class="icon-white" d="M 90 95 L 45 95 A 16 16 0 0 1 29 79 L 29 60 L 80 60" />
  </g>

  <text x="120" y="70" class="text-electro">Electro<tspan class="text-home">Home</tspan></text>
  <text x="124" y="94" class="text-tagline">PREMIUM ELECTRONICS</text>
</svg>
